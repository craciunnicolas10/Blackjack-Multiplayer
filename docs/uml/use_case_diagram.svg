<text x="760" y="852" font-weight="bold">Condiții</text>
<text x="760" y="874">• Împarte cărțile inițiale: după pariul ultimului jucător.</text>
<text x="760" y="894">• Joacă tura dealerului: după tura ultimului jucător</text>
<text x="772" y="912">(Stand, Double sau peste 21).</text>
<text x="760" y="932">• Dealerul e jucat automat de sistem; trage până la 17.</text>
<text x="760" y="952">• În rețea, jocul rulează la gazdă; fiecare jucător</text>
<text x="772" y="970">acționează doar pe locul lui, când e rândul lui.</text>
<text x="760" y="990">• Gazda poate face tot ce face un jucător (generalizare).</text>
